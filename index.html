<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Supported VRChat Builds</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 80% 45% at 50% -15%,#18304b 0%,transparent 75%),#080b12;color:#eef4ff}
main{width:min(740px,calc(100% - 36px));margin:0 auto;padding:clamp(62px,10vw,112px) 0 90px}
h1{font-size:clamp(2rem,5.2vw,3.25rem);font-weight:850;letter-spacing:-.065em;line-height:1.12;margin:0 0 30px}
h1 .w1{color:#74e6ff}
h1 .w2{color:#d4a7ff}
h1 .w3{color:#82f4cb}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #242d3e;border-radius:16px;padding:18px 20px;background:#111722;transition:border-color .2s,background .2s,transform .2s}
.item:hover{background:#161f2d;border-color:#38576b;transform:translateY(-1px)}
.name{font-weight:800;letter-spacing:-.035em;font-size:clamp(1.1rem,3vw,1.35rem)}
.name strong{color:#b9a4ff;font-weight:850}
.item:nth-child(3n+2) .name strong{color:#67e8f9}
.item:nth-child(3n) .name strong{color:#8bf2be}
.last-check{margin:24px 0 0;text-align:center;color:#8390a6;font-size:.83rem;font-weight:650;letter-spacing:.01em}
.last-check strong{color:#8bf2be;font-weight:800}
a{flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-width:125px;padding:12px 20px;border-radius:10px;background:#70f0d3;color:#061710;font-size:.84rem;font-weight:850;letter-spacing:.025em;transition:background .2s,transform .2s}
a:hover{background:#b0ffe9;transform:translateY(-1px)}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:430px){
main{width:calc(100% - 24px)}
.item{padding:15px 14px;border-radius:13px}
a{min-width:105px;padding:11px 14px}
.name{font-size:1.05rem}
}
</style>
</head>

<p class="last-check" id="last-check">
Last manual check: <strong>October 24, 2026</strong>
</p>

</main>

<script>
(async()=>{
  const el=document.getElementById("last-check");
  try {
    const response=await fetch("./last-check.json",{cache:"no-store"});
    if(!response.ok) return;

    const data=await response.json();
    if(typeof data.lastManualCheck!=="string" || !data.lastManualCheck.trim()) return;

    el.replaceChildren(document.createTextNode("Last manual check: "));

    const strong=document.createElement("strong");
    strong.textContent=data.lastManualCheck.trim();
    el.appendChild(strong);

  } catch (_) {
    /* Keep the last known date if the file is unavailable. */
  }
})();
</script>
